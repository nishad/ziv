[package]
name = "ziv-iiif"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# `iiif` is taken on crates.io, so this publishes under a `ziv-` prefix. The library target
# keeps the short name so no `use iiif::...` statement anywhere else in the workspace changes.
[lib]
name = "iiif"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest = "1"
