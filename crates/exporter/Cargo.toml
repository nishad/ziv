[package]
name = "ziv-exporter"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# `exporter` is taken on crates.io, so this publishes under a `ziv-` prefix. The library target
# keeps the short name so no `use exporter::...` statement anywhere else in the workspace changes.
[lib]
name = "exporter"

[dependencies]
# Keying on the pre-rename short name and pointing `package` at the renamed crate (rather than
# renaming the key) keeps every `use tiling::...`/`use iiif::...` in this crate unchanged: the
# `use`-visible name comes from the dependency KEY, not from the target crate's own name.
tiling = { version = "0.1.1", path = "../tiling", package = "ziv-tiling" }
iiif = { version = "0.1.1", path = "../iiif", package = "ziv-iiif" }
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Owns the single embedded copy of the vendored viewer tree; `ziv-server` depends on the same
# crate rather than each deriving its own `rust-embed` struct (see `viewer.rs`).
viewer-assets = { version = "0.1.1", path = "../viewer-assets", package = "ziv-viewer-assets" }
# Only for `Handle`/`Handle::try_current`/`Handle::enter` (`lib.rs`'s `ambient_runtime_handle`),
# which bridges a `rayon` tile-render worker thread into whatever tokio runtime `ziv export`'s
# caller is already running inside, so a remote-backed read's `pollster::block_on` call can reach
# a reactor. This crate itself never creates or drives a runtime (`Handle::try_current()` just
# queries thread-local state, and is `None` -- with no panic -- for every local-filesystem export,
# which is the common case and every test in this crate); `features` here just adds "rt" to
# whatever the workspace's own `tokio` entry already enables (`"full"`, via other members), not a
# narrower build of tokio.
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
zarr-core = { version = "0.1.1", path = "../zarr-core", package = "ziv-zarr-core" }
tempfile = "3"
# Only for `tests/remote_http_export.rs`: reproduces `ziv export`'s own call shape (metadata open
# and the export itself each run inside `tokio::task::spawn_blocking`, exactly like
# `crates/cli/src/lib.rs`'s `Command::Export` arm) against a REAL loopback HTTP server, so the
# test needs a real multi-thread tokio runtime rather than the library's own runtime-agnostic
# `pollster` path.
tokio.workspace = true
fixture-test-support = { path = "../fixture-test-support", package = "ziv-fixture-test-support" }
