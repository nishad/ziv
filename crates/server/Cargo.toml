[package]
name = "ziv-server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

# `server` is taken on crates.io, so this publishes under a `ziv-` prefix. The library target
# keeps the short name so no `use server::...` statement anywhere else in the workspace changes.
[lib]
name = "server"

[dependencies]
# Keying on the pre-rename short name and pointing `package` at the renamed crate (rather than
# renaming the key) keeps every `use tiling::...`/`use iiif::...`/etc. in this crate unchanged:
# the `use`-visible name comes from the dependency KEY, not from the target crate's own name.
tiling = { version = "0.1.0", path = "../tiling", package = "ziv-tiling" }
iiif = { version = "0.1.0", path = "../iiif", package = "ziv-iiif" }
projection = { version = "0.1.0", path = "../projection", package = "ziv-projection" }
# Owns the single embedded copy of the vendored viewer tree; `ziv-exporter` depends on the same
# crate rather than each deriving its own `rust-embed` struct (see `viewer.rs`).
viewer-assets = { version = "0.1.0", path = "../viewer-assets", package = "ziv-viewer-assets" }
axum.workspace = true
tokio = { workspace = true, features = ["signal"] }
mime_guess.workspace = true
serde_json.workspace = true
moka = { version = "0.12", features = ["future"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http = { version = "0.6", features = [
    "trace",
    "cors",
    "request-id",
    "timeout",
] }
tower = { version = "0.5", features = ["util", "limit", "load-shed"] }
# Direct dependencies (rather than purely transitive via axum) because `run_server` drives its own
# hyper accept loop instead of `axum::serve`: axum 0.8 builds hyper-util's auto `Builder` with no
# `Timer` installed, and hyper SILENTLY DROPS its `h1_header_read_timeout` default when there is no
# timer (`Time::check` returns None), so a half-sent request header holds a connection forever.
# Installing a `TokioTimer` and setting the timeout explicitly is only reachable by owning the
# loop. Versions pinned to what axum 0.8.9 already resolves so cargo keeps a single copy.
hyper = { version = "1.10", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "tokio",
] }
subtle = "2.6"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
metrics = "0.24"
thiserror.workspace = true
metrics-exporter-prometheus = { version = "0.16", default-features = false }
# The image registry opens images itself (see `registry::ImageRegistry::get`), so this is a real
# dependency rather than the test-only one it used to be.
zarr-core = { version = "0.1.0", path = "../zarr-core", package = "ziv-zarr-core" }

[dev-dependencies]
# The connection-limit tests drive the real accept loop over real sockets.
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt-multi-thread", "time"] }
# The level-2 conformance tests decode served PNGs to assert on real pixels.
png.workspace = true
tower = { version = "0.5", features = ["util"] }
